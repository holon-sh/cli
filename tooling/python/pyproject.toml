[project]
name = "cli-tooling-py"
version = "0.0.1"
description = "Python contract extractor and check runner embedded in the Holon CLI."
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["mcp>=2.3,<3", "mypy==2.4.0", "pytest==9.1.1", "ruff==0.16.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
files = ["extract.py", "runner.py"]
strict = true

[tool.ruff]
target-version = "py311"
