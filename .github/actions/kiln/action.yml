name: Kiln SDK
description: Download the SDK that Kiln published for the pinned commit and link Go against it.
runs:
  using: composite
  steps:
    - name: Download the SDK
      shell: bash
      env:
        repository: hughhan1/kiln
        ref: 9ecd2fc5bed0a47f29f1f666f0ed6bb3ef93f663
        GH_TOKEN: ${{ github.token }}
      run: |
        archive="kiln-$(go env GOOS)_$(go env GOARCH).tar.gz"
        gh release download "sdk-$ref" --repo "$repository" --pattern "$archive" --dir "$RUNNER_TEMP"
        gh attestation verify "$RUNNER_TEMP/$archive" --repo "$repository" --source-digest "$ref"
        mkdir .kiln-sdk
        tar -xzf "$RUNNER_TEMP/$archive" -C .kiln-sdk
    - name: Install the musl compiler
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y musl-tools
    - name: Configure Go linking
      shell: bash
      run: |
        {
          echo 'CGO_ENABLED=1'
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/.kiln-sdk/lib/pkgconfig"
          if [ "$RUNNER_OS" = Linux ]; then
            echo 'CC=musl-gcc'
            echo 'CGO_LDFLAGS=-static'
          else
            echo 'MACOSX_DEPLOYMENT_TARGET=15.0'
            echo 'CGO_CFLAGS=-O2 -g -mmacosx-version-min=15.0'
            echo 'CGO_LDFLAGS=-mmacosx-version-min=15.0'
          fi
        } >> "$GITHUB_ENV"
