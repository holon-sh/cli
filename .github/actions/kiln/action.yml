name: Build OCaml Kiln SDK
description: Fetch pinned public source and compile the native builder.
inputs:
  static:
    default: "false"
    description: Build a static musl SDK on Linux
runs:
  using: composite
  steps:
    - name: Check out Kiln
      uses: actions/checkout@v7
      with:
        repository: hughhan1/kiln
        ref: ae7ed1cfefacb9baaa13451b711392c99d4ef44f
        path: .kiln
        persist-credentials: false
    - name: Prepare build environment
      id: runner
      shell: bash
      run: |
        echo "image=$RUNNER_OS-$RUNNER_ARCH-$ImageVersion" >> "$GITHUB_OUTPUT"
        echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"
    - name: Cache compiled SDK
      uses: actions/cache@v6
      id: sdk
      with:
        path: .kiln-sdk
        key: kiln-${{ steps.runner.outputs.image }}-${{ inputs.static }}-${{ hashFiles('.github/actions/kiln/action.yml') }}
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y musl-tools pkg-config
    - uses: ocaml/setup-ocaml@v3
      if: steps.sdk.outputs.cache-hit != 'true' && (runner.os != 'Linux' || inputs.static != 'true')
      with:
        ocaml-compiler: '5.5.1'
        opam-repositories: |
          default: git+https://github.com/ocaml/opam-repository.git#74bf8da7ffea3971801da0d3540eb43f26d60fbd
    - name: Build SDK
      if: steps.sdk.outputs.cache-hit != 'true'
      shell: bash
      working-directory: .kiln
      env:
        KILN_STATIC: ${{ inputs.static }}
      run: |
        destination="$GITHUB_WORKSPACE/.kiln-sdk"
        if [ "$RUNNER_OS" = Linux ] && [ "$KILN_STATIC" = true ]; then
          docker buildx build --file packaging/Dockerfile --output "type=local,dest=$destination" .
        else
          if [ "$RUNNER_OS" = Linux ]; then
            export DUNE_WORKSPACE="$RUNNER_TEMP/dune-workspace"
            printf '(lang dune 3.18)\n(env (_ (link_flags (:standard -runtime-variant _pic))))\n' > "$DUNE_WORKSPACE"
          fi
          OPAMSWITCH="$GITHUB_WORKSPACE" scripts/package "$destination"
        fi
    - name: Configure Go linking
      shell: bash
      run: |
        {
          echo 'CGO_ENABLED=1'
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/.kiln-sdk/lib/pkgconfig"
          if [ "$RUNNER_OS" = macOS ]; then
            echo 'CGO_CFLAGS=-O2 -g -mmacosx-version-min=15.0'
            echo 'CGO_LDFLAGS=-mmacosx-version-min=15.0'
          fi
        } >> "$GITHUB_ENV"
