name: CI
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the binaries and packages
        type: string
        default: "0.0.1"
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tooling/typescript/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - name: Test the TypeScript extractor and runner
        working-directory: tooling/typescript
        run: |
          npm ci
          npm test
      - name: Test the Python extractor and runner
        working-directory: tooling/python
        run: |
          uv sync
          uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
          uv run --no-sync pytest
          uv run --no-sync mypy --strict
      - name: Embedded tooling archives are up to date
        run: |
          scripts/build-tooling
          git diff --exit-code pkg/tooling
  test-package:
    needs: tooling
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15
            target: darwin_arm64
          - runner: macos-15-intel
            target: darwin_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOLON_VERSION: ${{ inputs.version || '0.0.1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: go vet ./...
      - run: go test ./...
      - run: python3 scripts/package_cli.py --target '${{ matrix.target }}' --version "$HOLON_VERSION"
      - name: Verify Python launcher
        run: |
          uv venv .venv
          uv pip install --no-cache --no-index dist/holon_cli-*.whl
          uv run --no-project holon --version
      - name: Verify npm launcher
        run: |
          mkdir -p /tmp/holon-npm-smoke
          npm install --prefix /tmp/holon-npm-smoke "$PWD"/dist/*.tgz
          /tmp/holon-npm-smoke/node_modules/.bin/holon --version
      - uses: actions/upload-artifact@v4
        with:
          name: holon-cli-${{ matrix.target }}
          path: |
            dist/holon_*.tar.gz
            dist/holon_cli-*.whl
            dist/holon-sh-cli-*.tgz
            dist/SHA256SUMS
