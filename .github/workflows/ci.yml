name: CI
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the binaries
        type: string
        default: "0.0.1"
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tooling/typescript/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - name: Test the TypeScript extractor and runner
        working-directory: tooling/typescript
        run: |
          npm ci
          npm test
      - name: Test the Python extractor and runner
        working-directory: tooling/python
        run: |
          uv sync
          uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
          uv run --no-sync pytest
          uv run --no-sync mypy --strict
      - name: Embedded tooling archives are up to date
        run: |
          scripts/build-tooling
          git diff --exit-code pkg/tooling
  test:
    needs: tooling
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: go vet ./...
      - run: go test ./...
  test-package:
    needs: tooling
    strategy:
      fail-fast: false
      matrix:
        target: [linux_amd64, linux_arm64, darwin_amd64, darwin_arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HOLON_VERSION: ${{ inputs.version || '0.0.1' }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: python3 scripts/package_cli.py --target '${{ matrix.target }}' --version "$HOLON_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: holon-types-${{ matrix.target }}
          path: |
            dist/holon_*.tar.gz
            dist/SHA256SUMS
