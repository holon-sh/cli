name: CI
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the binaries
        type: string
        default: "0.0.1"
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tooling/typescript/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - name: Test the TypeScript extractor and runner
        working-directory: tooling/typescript
        run: |
          npm ci
          npm test
      - name: Test the Python extractor and runner
        working-directory: tooling/python
        run: |
          uv sync
          uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
          uv run --no-sync pytest
          uv run --no-sync mypy --strict
      - name: Embedded tooling archives are up to date
        run: |
          scripts/build-tooling
          git diff --exit-code pkg/tooling
  test:
    needs: tooling
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: uv run --with-requirements packaging/requirements.txt python -m unittest discover -s scripts
  test-package:
    name: test-package (${{ matrix.target }})
    needs: [tooling, package-launcher]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15
            target: darwin_arm64
          - runner: macos-15-intel
            target: darwin_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version || '0.0.1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
          enable-cache: false
      - run: uv run --with-requirements packaging/requirements.txt python scripts/package_cli.py --target '${{ matrix.target }}' --version "$VERSION" --format tarball --format wheel --format npm-platform
      - uses: actions/download-artifact@v4
        with:
          name: holon-types-launcher
          path: launcher
      - name: Install and run the wheel and npm packages
        run: |
          uv venv .venv
          uv pip install --python .venv --no-index dist/holon_types-*.whl
          .venv/bin/holon --version | grep -F "$VERSION"
          .venv/bin/holon types check --help >/dev/null
          npm install --prefix smoke "$PWD"/dist/*.tgz "$PWD"/launcher/*.tgz
          smoke/node_modules/.bin/holon types check --help >/dev/null
          (cd smoke && npx --no-install holon --version | grep -F "$VERSION")
      - uses: actions/upload-artifact@v4
        with:
          name: holon-types-${{ matrix.target }}
          path: dist/*
  package-launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python3 -m unittest discover -s packaging/tests
      - run: python3 scripts/package_cli.py --version '${{ inputs.version || '0.0.1' }}' --format npm-launcher
      - uses: actions/upload-artifact@v4
        with:
          name: holon-types-launcher
          path: dist/*
