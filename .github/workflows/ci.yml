name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15
            target: darwin_arm64
          - runner: macos-15-intel
            target: darwin_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: go vet ./...
      - run: go test ./...
      - run: python3 scripts/package_cli.py --target '${{ matrix.target }}' --version 0.1.0
      - name: Verify Python launcher
        run: |
          uv venv .venv
          uv pip install --no-cache --no-index --find-links dist holon-cli==0.1.0
          uv run --no-project holon --version
      - name: Verify npm launcher
        run: |
          mkdir -p /tmp/holon-npm-smoke
          npm install --prefix /tmp/holon-npm-smoke "$PWD"/dist/*.tgz
          /tmp/holon-npm-smoke/node_modules/.bin/holon --version
      - uses: actions/upload-artifact@v4
        with:
          name: holon-cli-${{ matrix.target }}
          path: |
            dist/holon_*.tar.gz
            dist/holon_cli-*.whl
            dist/holon-cli-*.tgz
            dist/SHA256SUMS
