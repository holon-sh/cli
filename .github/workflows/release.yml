name: Release
# Every push to main releases the next 0.0.1-dev.N prerelease; a stable
# release is a deliberate dispatch with its version.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (without the leading v), such as 0.0.1
        type: string
        required: true
permissions:
  contents: read
# One release at a time, so each run numbers itself after the previous tag.
# GitHub keeps one pending run per group: merges that land during a release
# are released together by the newest one.
concurrency: release
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then
            version=$INPUT
            python3 -c 'import sys; sys.path[0] = "scripts"; from package_cli import VERSION_PATTERN; sys.exit(not VERSION_PATTERN.fullmatch(sys.argv[1]))' "$version" \
              || { echo "::error::'$version' is not X.Y.Z or X.Y.Z-{alpha,beta,rc,dev}.N"; exit 1; }
            if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              echo "::error::v$version is already released"
              exit 1
            fi
          else
            released=$(git tag --points-at HEAD --list 'v*')
            if [ -n "$released" ]; then
              echo "::notice::$GITHUB_SHA is already released as $released"
              exit 0
            fi
            latest=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname | head -n1)
            latest=${latest#v}
            case "$latest" in
              *-dev.*) version="${latest%-dev.*}-dev.$((${latest##*-dev.} + 1))" ;;
              *) IFS=. read -r major minor patch <<< "$latest"; version="$major.$minor.$((patch + 1))-dev.1" ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    if: needs.version.outputs.version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: holon-types-*
          path: release
          merge-multiple: true
      - run: cd release && sha256sum holon_*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" --title "holon $VERSION" --target "$GITHUB_SHA" $prerelease \
            --notes "Install with \`curl -fsSL https://holon-labs.dev/install.sh | HOLON_VERSION=$VERSION sh\`, or download the archive for your platform below." \
            release/holon_*.tar.gz release/SHA256SUMS
  publish-pypi:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: holon-types-*
          path: artifacts
          merge-multiple: true
      - name: Collect the wheels
        run: |
          mkdir wheels
          cp artifacts/*.whl wheels/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
  publish-npm:
    needs: [version, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          pattern: holon-types-*
          path: dist
          merge-multiple: true
      - name: Publish platform packages before the launcher
        run: |
          tag=latest; case "$VERSION" in *-*) tag=next ;; esac
          for f in dist/holon-types-*-*-"$VERSION".tgz; do
            npm publish "./$f" --access public --tag "$tag"
          done
          npm publish "./dist/holon-types-$VERSION.tgz" --access public --tag "$tag"
